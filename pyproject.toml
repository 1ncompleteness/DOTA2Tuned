[project]
name = "dota2tuned"
version = "0.1.0"
description = "Dota 2 data platform, recommender, and Gradio assistant for the Hugging Face Build Small Hackathon."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "datasets>=3.0.0",
  "duckdb>=1.1.0",
  "gradio>=5.0.0",
  "httpx>=0.27.0",
  "huggingface-hub>=1.0.0",
  "joblib>=1.4.0",
  "numpy>=1.26.0",
  "polars>=1.0.0",
  "pyarrow>=16.0.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.0",
  "scikit-learn>=1.5.0",
  "tenacity>=8.3.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.0.0",
  "bitsandbytes>=0.44.0",
  "peft>=0.13.0",
  "torch>=2.4.0",
  "transformers>=4.51.0",
  "trl>=0.25.0",
]
lightgbm = ["lightgbm>=4.5.0"]
modal = ["modal>=0.64.0", "fastapi[standard]>=0.115.0"]
dev = ["pytest>=8.3.0", "ruff>=0.6.0"]

[project.scripts]
dota2tuned = "dota2tuned.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dota2tuned"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
